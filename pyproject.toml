[project]
name = "tdec-init"
version = "0.1.0"
description = "Warm starting neural dynamics models from few Jacobian samples."
readme = "README.md"
authors = [
    { name = "Maxime Rochkoulets", email = "mrochkoulets@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "decoupling==0.0.9",
    "equinox>=0.13.8",
    "jax==0.12.0.1",
    "jax==0.12.0.1",
    "jaxtyping>=0.3.11",
    "optax>=0.2.8",
    "tqdm>=4.70.1",
    "gymnax[visualize]",
]

[project.scripts]
tdec-init = "tdec_init:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
gymnax = { workspace = true }

[tool.uv.workspace]
members = ["gymnax"]